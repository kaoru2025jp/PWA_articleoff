<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>契約書生成システム</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: sans-serif;
    padding: 20px;
    line-height: 1.6;
  }
  input, button {
    font-size: 16px;
    padding: 6px;
    margin: 6px 0;
    width: 100%;
    max-width: 400px;
  }
  textarea {
    width: 100%;
    height: 280px;
    margin-top: 10px;
  }
  canvas {
    border: 1px solid #000;
    width: 100%;
    max-width: 600px;
    height: 200px;
    touch-action: none;
  }
  .section {
    margin-top: 20px;
  }
</style>
</head>

<body>

<h2>条文・契約書生成</h2>

<div class="section">
  <p>番号を入力してください（1〜7 / 1234567）</p>
  <input id="number" placeholder="例：1 または 1234567">
  <button onclick="fetchArticle()">取得</button>
</div>

<div class="section">
  <h3>契約者（企業名）</h3>
  <input placeholder="企業名①">
  <input placeholder="企業名②">
  <input placeholder="企業名③">
</div>

<div class="section">
  <h3>条文・契約書本文</h3>
  <textarea id="output" readonly></textarea>
</div>

<div class="section">
  <p>
    本契約書には、この文章の趣旨に基づき同意いたしました。
  </p>
</div>

<div class="section">
  <h3>署名</h3>
  <canvas id="sign" width="600" height="200"></canvas><br>
  <button onclick="clearSign()">署名をクリア</button>
</div>

<script>
/* ========= 設定 ========= */
const API_BASE =
  'https://script.google.com/macros/s/AKfycbyxNU98fsz_Rw2zS1mQp8YnU83cIDCI_futHiopxRJXXj_NrPGI-VBbRpp_NnC6p5J8/exec';

/* ========= JSONP 通信 ========= */
function fetchArticle() {
  const number = document.getElementById('number').value.trim();
  if (!number) {
    alert('番号を入力してください');
    return;
  }

  const callbackName = 'jsonp_callback_' + Date.now();
  const script = document.createElement('script');

  window[callbackName] = function (data) {
    delete window[callbackName];
    document.body.removeChild(script);

    if (data.error) {
      alert('APIエラー：番号が正しくありません');
      return;
    }

    if (data.type === 'single') {
      output.value = data.text;
    }

    if (data.type === 'contract') {
      output.value = Object.values(data.articles).join('\n\n');
    }
  };

  script.src =
    API_BASE +
    '?number=' + encodeURIComponent(number) +
    '&callback=' + callbackName;

  document.body.appendChild(script);
}

/* ========= 署名ボード ========= */
const canvas = document.getElementById('sign');
const ctx = canvas.getContext('2d');
let drawing = false;

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  return { x, y };
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('touchstart', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('touchmove', draw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchend', endDraw);

function startDraw(e) {
  e.preventDefault();
  drawing = true;
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
}

function endDraw() {
  drawing = false;
}

function clearSign() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>

</body>
</html>
