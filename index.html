<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>契約書生成</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: sans-serif; padding: 20px; }
  textarea { width: 100%; height: 260px; }
  canvas { border: 1px solid #000; }
</style>
</head>
<body>

<h2>条文取得</h2>

<input id="number" placeholder="1〜7 / 1234567">
<button id="btn">取得</button>

<textarea id="output" readonly></textarea>

<p>本契約書には、この文章の趣旨に基づき同意いたしました。</p>

<h3>署名</h3>
<canvas id="sign" width="600" height="200"></canvas>
<button onclick="clearSign()">クリア</button>

<script>
const API_URL = 'https://script.google.com/macros/s/【GASのID】/exec';

document.getElementById('btn').onclick = () => {
  const number = document.getElementById('number').value;
  console.log('request:', number);

  fetch(API_URL + '?number=' + number)
    .then(r => r.json())
    .then(d => {
      console.log('response:', d);

      if (d.type === 'single') {
        output.value = d.text;
      }
      if (d.type === 'contract') {
        output.value = Object.values(d.articles).join('\n\n');
      }
    })
    .catch(err => {
      alert('API通信エラー');
      console.error(err);
    });
};

// 署名
const canvas = document.getElementById('sign');
const ctx = canvas.getContext('2d');
let draw = false;

canvas.onmousedown = () => { draw = true; ctx.beginPath(); };
canvas.onmouseup = () => draw = false;
canvas.onmousemove = e => {
  if (!draw) return;
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
};

function clearSign() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>

</body>
</html>
